approved_exceptions:
  - gate: parcel
    approved_by: "Richard Reid (Oracle operator)"
    approved_at: "2026-10-20"
    reason: "Assessed roll (441,961 distinct real PROP_IDs) is the canonical denominator; GIS is 12.5% lower because condo and separately assessed units share a parent lot polygon."
    canonical_denominator: "TCAD 2026 certified roll, prop_type R, distinct unpadded PROP_ID"
    seed_decision: "Seed every assessed real parcel from the roll; geometry joined by PROP_ID then geo_id."
    excluded_population: "None from the seed. Business personal property (39,536), mobile homes (11,744) and minerals (5) are not real-property parcels and are out of the roofing seed."
    coverage_effect: "40,405 units carry parent-lot centroids (coordinate_basis parent_parcel_centroid); 11,211 have no coordinate until permit/address geocoding and are excluded from radius queries, reported as such."
