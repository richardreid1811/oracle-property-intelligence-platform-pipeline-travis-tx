parcel:
  canonical_source: tax_roll
  gis_source: "https://gis.traviscountytx.gov/server1/rest/services/Boundaries_and_Jurisdictions/TCAD_public/MapServer/0"
  gis_centroid_source: "https://services.arcgis.com/0L95CJ0VTaxqcmED/arcgis/rest/services/EXTERNAL_tcad_parcel/FeatureServer/0"
  gis_feature_count: 386682
  assessed_parcel_count: 441961        # distinct prop_type R in 2026 certified PROP.TXT (442,039 rows; 112 partial-owner rows)
  assessed_count_evidence: "export.zip sha256 62d0d1cd22b03f31db8d3986160eb181c5d00044df98a303fce9e17a44e9aa02, profiled 2026-10-20"
  discrepancy_threshold_pct: 2.0
  discrepancy_explanation: "GIS is 12.5% below the assessed roll. Of 441,961 assessed real parcels, 390,345 join a GIS polygon (379,608 by PROP_ID, 10,737 by geo_id only). Of the 51,616 without a polygon, 46,441 carry condo/unit legal descriptions and 40,405 share an 8-character geo_id prefix with a GIS parcel (condo parent lot). 6,634 GIS features have no current roll record (retired/split parcels)."
  seed_decision: "Seed from the assessed roll, never from GIS. Join geometry where it exists; never fabricate it."
  separately_assessed_without_geometry: acknowledged
  coordinate_basis:
    own_parcel_centroid: 390345
    parent_parcel_centroid: 40405
    none_pending_permit_or_address_geocode: 11211
  identifier_proven: true
  identifiers:
    prop_id: "TCAD PROP_ID. Roll stores it zero-padded to 12 digits (000000100008); canonical key is the unpadded decimal string used by GIS, Prodigy URLs and permits. Raw padded value kept as prop_id_raw."
    geo_id: "10-char string with leading zeros (e.g. 0174230307); equals GIS PID_10/geo_id and Austin permit tcad_id"
    deed_dt_format: "MM-DD-YYYY"

