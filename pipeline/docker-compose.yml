# Local ingestion stack (bootstrap-oracle-infra canonical layout).
# Restate = durable workflow engine for long scrapes; Postgres = internal reconciliation Query DB.
# Ports bind to loopback only: this stack is never a public runtime.
services:
  restate:
    image: restatedev/restate:1.7.2
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9070:9070"]
    volumes: ["restate-data:/restate-data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      RESTATE_NODE_NAME: restate-1
    restart: unless-stopped
  postgres:
    image: postgres:16
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_PASSWORD: elephant
      POSTGRES_DB: elephant
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped
volumes:
  restate-data:
  pg-data:
