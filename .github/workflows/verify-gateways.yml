# Independent retrieval proof: fetch every CID in each run manifest from public IPFS gateways this
# project does not operate (ipfs.io, dweb.link) and check bytes against the manifest. Runs for
# every run in history that has no verification yet (and re-verifies the latest daily), so earlier
# snapshots are shown to still resolve after later runs.
name: verify-gateways

on:
  push:
    branches: [travis-pipeline, main]
    paths:
      - "runs/*/manifest.json"
      - ".github/workflows/verify-gateways.yml"
      - "pipeline/src/publish/verify-gateways.mjs"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-gateways
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace pipeline --include-workspace-root=false --ignore-scripts
      - name: Pick runs
        id: pick
        run: |
          RUNS=$(node -e "
            const fs = require('fs');
            const runs = require('./runs/history.json').runs.map((r) => r.run_id);
            const latest = runs.at(-1);
            const todo = runs.filter((r) => r === latest || !fs.existsSync('runs/' + r + '/gateway-verification.json'));
            console.log(todo.join(' '));")
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
      - name: Verify on ipfs.io and dweb.link
        id: verify
        continue-on-error: true
        run: |
          status=0
          for RUN in ${{ steps.pick.outputs.runs }}; do
            node pipeline/src/publish/verify-gateways.mjs runs/$RUN/manifest.json --gateways https://ipfs.io,https://dweb.link --budget-min 40 || status=1
          done
          exit $status
      - name: Commit verification evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/*/gateway-verification.json
          git commit -m "Gateway verification: ${{ steps.pick.outputs.runs }}" || echo "no change"
          git pull --rebase && git push
      - name: Fail if any object failed
        if: steps.verify.outcome != 'success'
        run: exit 1
